[project]
name = "codex-model-tap"
version = "0.1.0"
description = "mitmproxy addon for selectively rerouting Codex ChatGPT traffic"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "mitmproxy>=12.0.0,<13.0.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
codex-model-tap = "codex_model_tap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
